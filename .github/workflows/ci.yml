name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck pg_health.sh

  report:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: --help and --version exit 0
        run: |
          ./pg_health.sh --help | grep -q '^Usage:'
          ./pg_health.sh -h | grep -q '^Usage:'
          ./pg_health.sh --version | grep -q '^pg_health.sh '
      - name: -o without a file is a usage error (exit 3)
        run: |
          set +e
          ./pg_health.sh -o; rc=$?
          echo "exit code: $rc"
          [ "$rc" -eq 3 ]
      - name: Report against PostgreSQL 16
        run: |
          ./pg_health.sh | tee report.md
          grep -q '^# PostgreSQL health report' report.md
          grep -q '| Server | PostgreSQL 16' report.md
          grep -q '| Role | primary |' report.md
      - name: Cache hit ratio, connections and database sizes are reported
        run: |
          ./pg_health.sh > report.md
          grep -q '^## Cache hit ratio' report.md
          grep -Eq '^Overall: \*\*[0-9.]+ %\*\*' report.md
          grep -q '^## Connections' report.md
          grep -Eq '^\| [0-9]+ \| 97 \| 100 \| [0-9.]+ \|$' report.md   # default 100 - 3 reserved
          grep -q '^## Database sizes' report.md
          grep -Eq '^\| postgres \| [0-9]+ [kMG]?B \|$' report.md
      - name: Bloated table and table needing VACUUM/ANALYZE are reported
        run: |
          # One psql session per step: statistics counters are flushed when a session ends.
          sql() { psql -X -v ON_ERROR_STOP=1 -qc "$1"; }
          sql "create table bloated (id int, pad text) with (autovacuum_enabled = off);
               create table dead (id int) with (autovacuum_enabled = off);
               insert into bloated select g, repeat('x', 100) from generate_series(1, 100000) g;
               insert into dead select generate_series(1, 10000);"
          # bloated: delete 90 % spread over every page, then VACUUM: the pages stay.
          sql "delete from bloated where id % 10 <> 0"
          sql "vacuum analyze bloated"
          # dead: dead rows and changes since ANALYZE that autovacuum may not clean.
          sql "analyze dead"
          sql "delete from dead where id <= 5000"
          ./pg_health.sh > report.md
          sed -n '/^## Table bloat/,$p' report.md
          grep -Eq '^\| public\.bloated \| [0-9]+ MB \| [0-9]+ MB \| (8|9)[0-9]\.[0-9] \|$' report.md
          grep -Eq '^\| public\.dead \| VACUUM \+ ANALYZE \| [0-9]+ \| 5000 \| ' report.md
      - name: Same report with a monitoring role (pg_monitor, no superuser)
        run: |
          psql -qAtc "create role monitor login password 'monitor' in role pg_monitor"
          PGUSER=monitor PGPASSWORD=monitor ./pg_health.sh -o report.md
          grep -q '| Connected as | monitor @ postgres |' report.md
      - name: Unreachable server gives exit 3
        run: |
          set +e
          ./pg_health.sh -p 5999; rc=$?
          echo "exit code: $rc"
          [ "$rc" -eq 3 ]
