name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck pg_health.sh

  top-queries:
    # Service containers cannot take server options, so start PostgreSQL by hand
    # with pg_stat_statements preloaded.
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 16 with pg_stat_statements
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            postgres:16 -c shared_preload_libraries=pg_stat_statements
          for _ in $(seq 1 30); do pg_isready -q && break; sleep 1; done
          sleep 2; pg_isready
      - name: Top queries are reported
        run: |
          psql -X -qc "create extension pg_stat_statements"
          psql -X -qc "create table t (id int); insert into t select generate_series(1, 200000)"
          for _ in 1 2 3; do psql -X -qAtc "select count(*) from t where id % 7 = 3" >/dev/null; done
          ./pg_health.sh > report.md || [ $? -le 2 ]
          sed -n '/^## Top queries/,/^## Replication/p' report.md
          grep -Eq '^\| 3 \| [0-9.]+ s \| [0-9.]+ \| [0-9.]+ \| 3 \| select count\(\*\) from t where id % \$1 = \$2 \|$' report.md

  report:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: --help and --version exit 0
        run: |
          ./pg_health.sh --help | grep -q '^Usage:'
          ./pg_health.sh -h | grep -q '^Usage:'
          ./pg_health.sh --version | grep -q '^pg_health.sh '
      - name: -o without a file is a usage error (exit 3)
        run: |
          set +e
          ./pg_health.sh -o; rc=$?
          echo "exit code: $rc"
          [ "$rc" -eq 3 ]
      - name: Report against PostgreSQL 16
        run: |
          # fresh server: every check must be OK -> exit 0
          set +e; ./pg_health.sh > report.md; rc=$?; set -e
          cat report.md
          echo "exit code: $rc"; [ "$rc" -eq 0 ]
          grep -q '^Overall: \*\*OK\*\*$' report.md
          grep -q '^| Cache hit ratio | OK |' report.md
          grep -q '^# PostgreSQL health report' report.md
          grep -q '| Server | PostgreSQL 16' report.md
          grep -q '| Role | primary |' report.md
      - name: Cache hit ratio, connections and database sizes are reported
        run: |
          ./pg_health.sh > report.md || [ $? -le 2 ]
          grep -q '^## Cache hit ratio' report.md
          grep -Eq '^Overall: \*\*[0-9.]+ %\*\*' report.md
          grep -q '^## Connections' report.md
          grep -Eq '^\| [0-9]+ \| 97 \| 100 \| [0-9.]+ \|$' report.md   # default 100 - 3 reserved
          grep -q '^## Database sizes' report.md
          grep -Eq '^\| postgres \| [0-9]+ [kMG]?B \|$' report.md
      - name: Bloated table and table needing VACUUM/ANALYZE are reported
        run: |
          # One psql session per step: statistics counters are flushed when a session ends.
          sql() { psql -X -v ON_ERROR_STOP=1 -qc "$1"; }
          sql "create table bloated (id int, pad text) with (autovacuum_enabled = off);
               create table dead (id int) with (autovacuum_enabled = off);
               insert into bloated select g, repeat('x', 100) from generate_series(1, 100000) g;
               insert into dead select generate_series(1, 10000);"
          # bloated: delete 90 % spread over every page, then VACUUM: the pages stay.
          sql "delete from bloated where id % 10 <> 0"
          sql "vacuum analyze bloated"
          # dead: dead rows and changes since ANALYZE that autovacuum may not clean.
          sql "analyze dead"
          sql "delete from dead where id <= 5000"
          ./pg_health.sh > report.md || [ $? -le 2 ]
          sed -n '/^## Table bloat/,$p' report.md
          grep -Eq '^\| public\.bloated \| [0-9]+ MB \| [0-9]+ MB \| (8|9)[0-9]\.[0-9] \|$' report.md
          grep -Eq '^\| public\.dead \| VACUUM \+ ANALYZE \| [0-9]+ \| 5000 \| ' report.md
      - name: Unused and duplicate indexes are reported
        run: |
          sql() { psql -X -v ON_ERROR_STOP=1 -qc "$1"; }
          sql "create table orders (id int primary key, customer int, note text);
               insert into orders select g, g % 100, 'n' from generate_series(1, 20000) g;
               create index orders_customer_idx on orders (customer);
               create index orders_customer_idx2 on orders (customer);
               create index orders_note_idx on orders (note);"
          sql "select count(*) from orders where id = 42"   # uses the primary key only
          set +e; ./pg_health.sh > report.md; rc=$?; set -e
          sed -n '/^## Unused indexes/,$p' report.md
          echo "exit code: $rc (1 expected: WARN for bloat, vacuum and indexes)"; [ "$rc" -eq 1 ]
          grep -q '^Overall: \*\*WARN\*\*$' report.md
          grep -Eq '^\| Table bloat \| WARN \| up to (8|9)[0-9]\.[0-9] % bloat' report.md
          grep -q '^| VACUUM / ANALYZE | WARN |' report.md
          grep -q '^| Unused indexes | WARN |' report.md
          grep -q '^| Duplicate indexes | WARN | 1 set(s) of identical indexes, first on table orders' report.md
          grep -q '^\*\*Status: WARN\*\* — ' report.md
          grep -Eq '^\| public\.orders_note_idx \| orders \| [0-9]+ kB \| 0 \|$' report.md
          if sed -n '/^## Unused indexes/,/^## Duplicate/p' report.md | grep -q 'orders_pkey'; then
            echo "primary key must not be listed as unused"; exit 1
          fi
          grep -Eq '^\| orders \| orders_customer_idx, orders_customer_idx2 \| [0-9]+ kB \|$' report.md
      - name: Replication, inactive slot and wraparound are reported
        run: |
          psql -X -qAtc "select pg_create_physical_replication_slot('old_standby', true)"
          ./pg_health.sh > report.md || [ $? -le 2 ]
          sed -n '/^## Top queries/,$p' report.md
          grep -q 'pg_stat_statements is not installed' report.md
          grep -q '^| Replication | WARN | 1 inactive replication slot(s)' report.md
          grep -q '^| XID wraparound | OK |' report.md
          grep -q '^## Replication$' report.md
          grep -Eq '^\| old_standby \| physical \| no \| [0-9]+ (bytes|kB|MB) \|$' report.md
          grep -q '^## Transaction ID wraparound' report.md
          grep -Eq '^\| postgres \| [0-9]+ \| [0-9.]+ \| 200000000 \|$' report.md
      - name: Same report with a monitoring role (pg_monitor, no superuser)
        run: |
          psql -qAtc "create role monitor login password 'monitor' in role pg_monitor"
          PGUSER=monitor PGPASSWORD=monitor ./pg_health.sh -o report.md || [ $? -le 2 ]
          grep -q '| Connected as | monitor @ postgres |' report.md
      - name: Unreachable server gives exit 3
        run: |
          set +e
          ./pg_health.sh -p 5999; rc=$?
          echo "exit code: $rc"
          [ "$rc" -eq 3 ]
