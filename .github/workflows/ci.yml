name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck pg_health.sh tests/*.sh

  top-queries:
    # Service containers cannot take server options, so start PostgreSQL by hand
    # with pg_stat_statements preloaded.
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL 16 with pg_stat_statements
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            postgres:16 -c shared_preload_libraries=pg_stat_statements
          for _ in $(seq 1 30); do pg_isready -q && break; sleep 1; done
          sleep 2; pg_isready
      - name: Top queries are reported
        run: |
          psql -X -qc "create extension pg_stat_statements"
          psql -X -qc "create table t (id int); insert into t select generate_series(1, 200000)"
          for _ in 1 2 3; do psql -X -qAtc "select count(*) from t where id % 7 = 3" >/dev/null; done
          ./pg_health.sh > report.md || [ $? -le 2 ]
          sed -n '/^## Top queries/,/^## Replication/p' report.md
          grep -Eq '^\| 3 \| [0-9.]+ s \| [0-9.]+ \| [0-9.]+ \| 3 \| select count\(\*\) from t where id % \$1 = \$2 \|$' report.md

  report:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: --help and --version exit 0
        run: |
          ./pg_health.sh --help | grep -q '^Usage:'
          ./pg_health.sh -h | grep -q '^Usage:'
          ./pg_health.sh --version | grep -q '^pg_health.sh '
      - name: -o without a file is a usage error (exit 3)
        run: |
          set +e
          ./pg_health.sh -o; rc=$?
          echo "exit code: $rc"
          [ "$rc" -eq 3 ]
      - name: Report against PostgreSQL 16
        run: |
          # fresh server: every check must be OK -> exit 0
          set +e; ./pg_health.sh > report.md; rc=$?; set -e
          cat report.md
          echo "exit code: $rc"; [ "$rc" -eq 0 ]
          grep -q '^Overall: \*\*OK\*\*$' report.md
          grep -q '^| Cache hit ratio | OK |' report.md
          grep -q '^# PostgreSQL health report' report.md
          grep -q '| Server | PostgreSQL 16' report.md
          grep -q '| Role | primary |' report.md
      - name: Cache hit ratio, connections and database sizes are reported
        run: |
          ./pg_health.sh > report.md || [ $? -le 2 ]
          grep -q '^## Cache hit ratio' report.md
          grep -Eq '^Overall: \*\*[0-9.]+ %\*\*' report.md
          grep -q '^## Connections' report.md
          grep -Eq '^\| [0-9]+ \| 97 \| 100 \| [0-9.]+ \|$' report.md   # default 100 - 3 reserved
          grep -q '^## Database sizes' report.md
          grep -Eq '^\| postgres \| [0-9]+ [kMG]?B \|$' report.md
      - name: Seed a demo database with every problem (tests/seed.sh)
        run: tests/seed.sh pg_health_demo
      - name: Every seeded problem is reported, Markdown and HTML (tests/check-report.sh)
        run: tests/check-report.sh pg_health_demo
      - name: Saved Markdown converts to HTML without a database
        run: |
          ./pg_health.sh -d pg_health_demo -o report.md || [ $? -le 2 ]
          ./pg_health.sh -d pg_health_demo -o report.html || [ $? -le 2 ]
          PGHOST=/nonexistent ./pg_health.sh --to-html report.md > converted.html
          grep -q '<td><span class="st WARN">WARN</span></td>' converted.html
      - name: Keep the reports
        uses: actions/upload-artifact@v4
        with:
          name: example-reports
          path: |
            report.md
            report.html
      - name: Same report with a monitoring role (pg_monitor, no superuser)
        run: |
          psql -qAtc "create role monitor login password 'monitor' in role pg_monitor"
          PGUSER=monitor PGPASSWORD=monitor ./pg_health.sh -o report.md || [ $? -le 2 ]
          grep -q '| Connected as | monitor @ postgres |' report.md
      - name: Unreachable server gives exit 3
        run: |
          set +e
          ./pg_health.sh -p 5999; rc=$?
          echo "exit code: $rc"
          [ "$rc" -eq 3 ]
